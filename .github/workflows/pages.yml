name: Build and deploy Osteo3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Check JavaScript syntax
        run: node scripts/check-js-syntax.mjs
      - name: Run smoke tests
        run: pnpm test
      - name: Validate PWA artifact
        run: pnpm validate-pwa
      - name: Validate model assets and licenses
        run: pnpm validate-model-assets
      - name: Validate local-only data flows
        run: pnpm validate-privacy
      - name: Run browser PWA tests
        run: pnpm test:e2e
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages entry point
        env:
          OSTEO3D_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages.mjs
